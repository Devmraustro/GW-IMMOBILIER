name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Dependency audit diagnostic
        continue-on-error: true
        shell: bash
        run: |
          npm audit --json > "$RUNNER_TEMP/npm-audit.json" || true
          node - "$RUNNER_TEMP/npm-audit.json" <<'NODE'
          const fs = require('node:fs');
          const audit = JSON.parse(fs.readFileSync(process.argv[2], 'utf8'));
          console.log('Vulnerability summary:', JSON.stringify(audit.metadata?.vulnerabilities ?? {}));
          for (const [name, advisory] of Object.entries(audit.vulnerabilities ?? {})) {
            if (!['high', 'critical'].includes(advisory.severity)) continue;
            console.log(JSON.stringify({
              name,
              severity: advisory.severity,
              range: advisory.range,
              via: (advisory.via ?? []).map(item =>
                typeof item === 'string' ? item : { title: item.title, url: item.url, range: item.range }
              ),
              fixAvailable: advisory.fixAvailable
            }));
          }
          NODE

      - name: TypeScript
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Production build
        run: npm run build
