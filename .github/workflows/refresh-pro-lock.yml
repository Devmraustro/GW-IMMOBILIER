name: Refresh Pro Lockfile

on:
  push:
    branches:
      - 'pro/phase-1-foundation'
    paths:
      - 'package.json'

permissions:
  contents: write

concurrency:
  group: refresh-pro-lockfile
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Refresh dependency lock
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm audit fix --package-lock-only --ignore-scripts --no-fund || true

      - name: Commit lockfile changes
        shell: bash
        run: |
          if git diff --quiet -- package-lock.json; then
            echo "package-lock.json is already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "chore(pro): regenerate dependency lockfile"
          git push origin "HEAD:${GITHUB_REF_NAME}"
